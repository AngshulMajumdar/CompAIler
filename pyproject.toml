[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compailer"
version = "0.1.0"
description = "CPU-only model-assisted C source repair with compiler and behavioral guardrails"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Angshul Majumdar"}]
dependencies = ["wasmtime==39.0.0"]

[project.optional-dependencies]
model = ["llama-cpp-python==0.3.36"]
web = ["gradio==5.49.1", "httpx[socks]>=0.28,<0.29"]
test = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
compailer = "compailer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
